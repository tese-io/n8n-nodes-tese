# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement.
#
# ONE-TIME SETUP (npm Trusted Publishing — recommended):
#   1. npmjs.com → n8n-nodes-tese → Settings → Trusted Publishers → Add
#   2. Provider: GitHub Actions
#        Owner: tese-io
#        Repository: n8n-nodes-tese
#        Workflow: publish.yml
#   3. Do not set NPM_TOKEN unless using token fallback (Option B in n8n docs)
#
# RELEASE PROCESS:
#   npm run release    # locally: bump, tag, push (does NOT publish to npm)
#   git push origin <tag> triggers this workflow to publish with provenance

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish with provenance
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
            npm run release
          else
            npm run build
            unset NODE_AUTH_TOKEN
            npm publish --access public --ignore-scripts
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
